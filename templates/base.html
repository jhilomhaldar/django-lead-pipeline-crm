{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Room CRM{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<!-- Top Navbar -->
<nav class="navbar navbar-dark bg-dark px-3">
    <div class="d-flex align-items-center">
        <img src="{% static 'images/logo.png' %}" alt="Logo" height="40" class="me-2">
        <span class="navbar-brand mb-0 h5">Room CRM</span>
    </div>
</nav>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="bg-light border" style="width: 250px; min-height: 100vh;">
        <div class="text-center py-3 border-bottom">
            <strong>CRM Panel</strong>
        </div>
        <ul class="nav flex-column p-3">

            <li class="nav-item mb-2">
                <a class="nav-link" href="{% url 'dashboard_home' %}">
                    <i class="fa fa-home"></i> Dashboard
                </a>
            </li>

            <li class="nav-item mb-2">
                <a class="nav-link" href="{% url 'lead_list' %}">
                    <i class="fa fa-user"></i> Leads
                </a>
            </li>
            
            <li class="nav-item">
                <a class="nav-link" href="{% url 'deal_list' %}">
                    <i class="fas fa-handshake me-2"></i> Deals
                </a>
            </li>

        </ul>
    </div>

    <!-- Main Content -->
    <div class="p-4 w-100">
        <div class="mb-4">
            <h3 class="mb-1">{% block page_title %}{% endblock %}</h3>
            <p class="text-muted mb-0">{% block page_subtitle %}{% endblock %}</p>
        </div>

        {% block content %}
        {% endblock %}
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
