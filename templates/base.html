{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Room CRM{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<!-- Top Navbar -->
<nav class="navbar navbar-dark bg-dark px-3">
    <div class="d-flex align-items-center">
        <img src="{% static 'images/logo.png' %}" alt="Logo" height="40" class="me-2">
        <span class="navbar-brand mb-0 h5">Room CRM</span>
    </div>
</nav>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="bg-light border" style="width: 250px; min-height: 100vh;">
        <div class="text-center py-3 border-bottom">
            <strong>CRM Panel</strong>
        </div>
        <ul class="nav flex-column p-3">

            <li class="nav-item mb-2">
                <a class="nav-link" href="/">
                    <i class="fa fa-home"></i> Dashboard
                </a>
            </li>

            <li class="nav-item mb-2">
                <a class="nav-link" href="/leads/">
                    <i class="fa fa-user"></i> Leads
                </a>
            </li>

        </ul>
    </div>

    <!-- Main Content -->
    <div class="p-4 w-100">
        {% block content %}
        {% endblock %}
    </div>

</div>

</body>
</html>
