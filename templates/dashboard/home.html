{% extends 'base.html' %}

{% block title %}Dashboard | Room CRM{% endblock %}

{% block content %}
<div class="container-fluid">

    <div class="mb-4">
        <h2 class="mb-1">Dashboard</h2>
        <p class="text-muted mb-0">Welcome to Room CRM management panel.</p>
    </div>

    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted">Total Leads</h6>
                            <h3 class="mb-0">{{ total_leads }}</h3>
                        </div>
                        <div class="fs-2 text-primary">
                            <i class="fa-solid fa-users"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted">Total Deals</h6>
                            <h3 class="mb-0">0</h3>
                        </div>
                        <div class="fs-2 text-success">
                            <i class="fa-solid fa-handshake"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted">Pipeline Stages</h6>
                            <h3 class="mb-0">0</h3>
                        </div>
                        <div class="fs-2 text-warning">
                            <i class="fa-solid fa-chart-line"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}
