{% extends 'base.html' %}

{% block title %}Add Lead | Room CRM{% endblock %}

{% block content %}
<div class="container-fluid">

    <div class="mb-4">
        <h2 class="mb-1">Add Lead</h2>
        <p class="text-muted mb-0">Create a new lead in Room CRM.</p>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">First Name</label>
                        {{ form.first_name }}
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Last Name</label>
                        {{ form.last_name }}
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        {{ form.email }}
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone</label>
                        {{ form.phone }}
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Company</label>
                        {{ form.company }}
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Status</label>
                        {{ form.status }}
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Save Lead
                    </button>
                    <a href="/leads/" class="btn btn-secondary ms-2">Back</a>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
